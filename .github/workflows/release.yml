name: Release

on:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'pyproject.toml'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js (for package.json)
        if: contains(github.event.head_commit.changed, 'package.json')
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python (for pyproject.toml)
        if: contains(github.event.head_commit.changed, 'pyproject.toml')
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry (for Python)
        if: contains(github.event.head_commit.changed, 'pyproject.toml')
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Bump version and create tag
        uses: anothrNick/github-tag-action@1.71.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch
